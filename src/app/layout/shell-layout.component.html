<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" routerLink="/dashboard">
      <i class="bi bi-building me-2"></i>Hotel Management
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        @for (item of navItems; track item.path) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="item.path" routerLinkActive="active">
              <i class="bi {{ item.icon }} me-1"></i>{{ item.label }}
            </a>
          </li>
        }
      </ul>
      <button class="btn btn-outline-light btn-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </div>
</nav>

<main class="container-fluid py-4 px-3 px-lg-4">
  <router-outlet />
</main>

<app-confirm-dialog
  [visible]="confirmDialog.visible"
  [title]="confirmDialog.options.title ?? 'Confirm'"
  [message]="confirmDialog.options.message"
  [confirmText]="confirmDialog.options.confirmText ?? 'Confirm'"
  [danger]="confirmDialog.options.danger ?? false"
  (confirmed)="onConfirm()"
  (cancelled)="onCancel()"
/>

<app-toast-container />
