<div class="mb-4">
  <a routerLink="/rooms" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to rooms</a>
  <h1 class="h3 mt-2 mb-0">{{ isEdit ? 'Edit Room' : 'Add Room' }}</h1>
</div>

@if (loading) {
  <app-loading-spinner [fullscreen]="true" />
} @else {
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="roomNumber">Room Number</label>
          <input id="roomNumber" class="form-control" formControlName="roomNumber" [class.is-invalid]="getControlError('roomNumber')" />
          @if (getControlError('roomNumber'); as err) {
            <div class="invalid-feedback d-block">{{ err }}</div>
          }
        </div>
        <div class="col-md-4">
          <label class="form-label" for="roomType">Room Type</label>
          <select id="roomType" class="form-select" formControlName="roomType">
            @for (type of roomTypes; track type) {
              <option [value]="type">{{ type }}</option>
            }
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="pricePerNight">Price Per Night</label>
          <input id="pricePerNight" type="number" step="0.01" class="form-control" formControlName="pricePerNight" [class.is-invalid]="getControlError('pricePerNight')" />
          @if (getControlError('pricePerNight'); as err) {
            <div class="invalid-feedback d-block">{{ err }}</div>
          }
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit" [disabled]="saving">
            @if (saving) { <span class="spinner-border spinner-border-sm me-2"></span> }
            {{ isEdit ? 'Update Room' : 'Create Room' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
